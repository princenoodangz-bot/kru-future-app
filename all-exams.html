    'สถิติและข้อมูลเชิงตัวเลข': { desc: 'ค่าเฉลี่ย ฐานนิยม มัธยฐาน และความน่าจะเป็น', icon: 'query_stats' },

    'ความเข้าใจภาษาและการตีความ': { desc: 'อนุมาน ตีความบทความ และความหมายแฝง', icon: 'find_in_page' },
    'การใช้คำและกลุ่มคำ': { desc: 'คำราชาศัพท์ คำสะกดถูก-ผิด และสำนวนไทย', icon: 'spellcheck' },
    'การเรียงลำดับข้อความ': { desc: 'ตรรกะการจัดลำดับประโยคและข้อความต่อเนื่อง', icon: 'format_list_numbered' },
    'อุปมาอุปไมย': { desc: 'ความสัมพันธ์เชิงเปรียบเทียบคู่คำและมโนทัศน์', icon: 'compare_arrows' },
    'ตรรกศาสตร์และเหตุผล': { desc: 'การสรุปความสมเหตุสมผล เงื่อนไขสัญลักษณ์', icon: 'schema' },
    'มิติสัมพันธ์และอนุกรมภาพ': { desc: 'รูปทรงเรขาคณิต ภาพหมุน และความสัมพันธ์ภาพ', icon: 'polyline' },
    'Grammar & Structure': { desc: 'ไวยากรณ์ Tenses Part of Speech และประโยค', icon: 'text_fields' },
    'Vocabulary & Context': { desc: 'คำศัพท์และบริบทความหมายในชีวิตประจำวัน', icon: 'translate' },
    'Reading Comprehension': { desc: 'อ่านจับใจความบทความ ป้ายประกาศ และอีเมล', icon: 'chrome_reader_mode' },
    'Conversation': { desc: 'บทสนทนาสถานการณ์จริงและสำนวนภาษา', icon: 'forum' },
    'พ.ร.บ. ระเบียบบริหารราชการแผ่นดิน': { desc: 'โครงสร้างราชการส่วนกลาง ส่วนภูมิภาค ท้องถิ่น', icon: 'account_balance' },
    'พ.ร.บ. วิธีปฏิบัติราชการทางปกครอง': { desc: 'คำสั่งทางปกครอง อำนาจหน้าที่ และการอุทธรณ์', icon: 'gavel' },
    'หลักกิจการบ้านเมืองที่ดี (ธรรมาภิบาล)': { desc: 'การบริหารราชการเพื่อประโยชน์สุขของประชาชน', icon: 'policy' },
    'มาตรฐานทางจริยธรรมและวินัย': { desc: 'ประมวลจริยธรรม ข้อห้าม วินัยและการลงโทษ', icon: 'verified_user' },
    'หลักสูตรแกนกลางและการพัฒนาหลักสูตร': { desc: 'หลักสูตร 51/ปรับปรุง มาตรฐานและตัวชี้วัด', icon: 'school' },
    'การจัดการเรียนรู้เชิงรุก (Active Learning)': { desc: 'เทคนิคการสอน แผนการสอน และสมรรถนะผู้เรียน', icon: 'local_library' },
    'จิตวิทยาพัฒนาการและการแนะแนว': { desc: 'ธรรมชาติผู้เรียน พฤติกรรม และระบบดูแลช่วยเหลือ', icon: 'psychology' },
    'การวัดและประเมินผลการเรียนรู้': { desc: 'เครื่องมือวัดผล รูบริกส์ และการวิจัยในชั้นเรียน', icon: 'analytics' },
    'การบริหารจัดการชั้นเรียน': { desc: 'บรรยากาศชั้นเรียน วินัยเชิงบวก และความปลอดภัย', icon: 'meeting_room' },
    'การประกันคุณภาพการศึกษา': { desc: 'ระบบประกันคุณภาพภายใน-ภายนอก และมาตรฐาน รร.', icon: 'workspace_premium' },
    'วิทยาการคำนวณและขั้นตอนวิธี': { desc: 'อัลกอริทึม การเขียนโปรแกรม และ Computational Thinking', icon: 'terminal' },
    'ฮาร์ดแวร์และระบบเครือข่าย': { desc: 'สถาปัตยกรรมคอมพิวเตอร์ LAN, IP และ Network', icon: 'dns' },
    'ความมั่นคงปลอดภัยและกฎหมายดิจิทัล': { desc: 'Cybersecurity, PDPA และ พ.ร.บ.คอมพิวเตอร์', icon: 'security' }
  };

  let EXAM_TOPIC_DATABASE = [];
  let currentPart = 'ภาค ก';
  let currentCategory = 'all';
  let currentSubCategory = 'all';
  let currentSearchQuery = '';
  let currentViewMode = 'grid';

  let activeExamConfig = {
    part: 'ภาค ก',
    category: '',
    subCategory: '',
    topic: '',
    mode: 'practice',
    count: 20
  };

  // ดึงหัวข้อที่มีข้อสอบจริงจาก Supabase
  async function fetchRealtimeTopics() {
    try {
      if (!window.supabase) return;
      const { data, error } = await supabase
        .from('questions')
        .select('exam_part, exam_category, exam_sub_category, exam_topic');

      if (error || !data) throw error;

      const topicMap = {};
      data.forEach(q => {
        const part = (q.exam_part || 'ภาค ก').trim();
        const cat = (q.exam_category || 'หมวดวิชาทั่วไป').trim();
        const sub = (q.exam_sub_category || 'กลุ่มวิชาย่อย').trim();
        const top = (q.exam_topic || '').trim();

        if (!top) return;

        const uniqueKey = `${part}_${cat}_${sub}_${top}`;
        if (!topicMap[uniqueKey]) {
          const preset = TOPIC_PRESETS[top] || { desc: `แบบฝึกหัดข้อสอบเรื่อง ${top}`, icon: 'menu_book' };
          topicMap[uniqueKey] = {
            part, category: cat, subCategory: sub, topic: top,
            desc: preset.desc, icon: preset.icon, count: 0
          };
        }
        topicMap[uniqueKey].count++;
      });

      EXAM_TOPIC_DATABASE = Object.values(topicMap);
    } catch (err) {
      console.warn("ไม่สามารถโหลดหัวข้อได้:", err);
    }
  }

  // เลือกระดับที่ 1: ภาค ก หรือ ข
  function selectMainPart(part) {
    currentPart = part;
    currentCategory = 'all';
    currentSubCategory = 'all';

    const tabA = document.getElementById('tabPartA');
    const tabB = document.getElementById('tabPartB');

    if (part === 'ภาค ก') {
      tabA.className = 'px-4 py-1.5 rounded-xl bg-[#755634] text-white text-xs font-bold shadow-xs transition-all';
      tabB.className = 'px-4 py-1.5 rounded-xl text-slate-600 text-xs font-bold hover:text-slate-800 transition-all';
    } else {
      tabB.className = 'px-4 py-1.5 rounded-xl bg-[#755634] text-white text-xs font-bold shadow-xs transition-all';
      tabA.className = 'px-4 py-1.5 rounded-xl text-slate-600 text-xs font-bold hover:text-slate-800 transition-all';
    }

    renderCategoryLevel2();
  }

  // เลือกระดับที่ 2: หมวดวิชาหลัก
  function renderCategoryLevel2() {
    const container = document.getElementById('categoryContainer');
    const partData = EXAM_TOPIC_DATABASE.filter(item => item.part === currentPart);
    const categories = ['all', ...new Set(partData.map(item => item.category))];

    container.innerHTML = categories.map(cat => {
      const isSelected = (currentCategory === cat);
      const title = cat === 'all' ? 'ทั้งหมดทุกหมวด' : cat;
      const btnStyle = isSelected 
        ? 'bg-[#755634] text-white border-[#755634]' 
        : 'bg-white text-slate-600 border-[#E8DFD3] hover:bg-stone-50';

      return `
        <button onclick="selectCategoryLevel2('${cat.replace(/'/g, "\\'")}')" 
                class="px-3 py-1 rounded-xl border text-xs font-bold whitespace-nowrap shrink-0 transition-all shadow-2xs ${btnStyle}">
          ${title}
        </button>
      `;
    }).join('');

    renderSubCategoryLevel3();
  }

  function selectCategoryLevel2(cat) {
    currentCategory = cat;
    currentSubCategory = 'all';
    renderCategoryLevel2();
  }

  // เลือกระดับที่ 3: กลุ่มวิชาย่อย
  function renderSubCategoryLevel3() {
    const container = document.getElementById('subCategoryContainer');
    let filtered = EXAM_TOPIC_DATABASE.filter(item => item.part === currentPart);
    if (currentCategory !== 'all') {
      filtered = filtered.filter(item => item.category === currentCategory);
    }

    const subCats = ['all', ...new Set(filtered.map(item => item.subCategory))];
    if (subCats.length <= 2 && subCats.includes('all')) {
      container.classList.add('hidden');
    } else {
      container.classList.remove('hidden');
    }

    container.innerHTML = subCats.map(sub => {
      const isSelected = (currentSubCategory === sub);
      const title = sub === 'all' ? '• ทุกกลุ่มย่อย' : sub;
      const btnStyle = isSelected 
        ? 'bg-[#f5eee6] text-[#755634] border-[#755634] font-bold' 
        : 'bg-white/80 text-slate-500 border-slate-200 hover:text-slate-800';

      return `
        <button onclick="selectSubCategoryLevel3('${sub.replace(/'/g, "\\'")}')" 
                class="px-2.5 py-0.5 rounded-lg border text-[11px] whitespace-nowrap shrink-0 transition-all ${btnStyle}">
          ${title}
        </button>
      `;
    }).join('');

    renderCardsLevel4();
  }

  function selectSubCategoryLevel3(sub) {
    currentSubCategory = sub;
    renderSubCategoryLevel3();
  }

  // เลือกระดับที่ 4: การ์ดเรื่องย่อย
  function renderCardsLevel4() {
    const container = document.getElementById('cardsDisplayContainer');
    const badgeCount = document.getElementById('topicCountBadge');
    const notice = document.getElementById('noResultsNotice');
    if (!container) return;

    const isGrid = (currentViewMode === 'grid');
    container.className = isGrid ? 'grid grid-cols-2 gap-2.5' : 'flex flex-col gap-2';

    const results = EXAM_TOPIC_DATABASE.filter(item => {
      const matchPart = (item.part === currentPart);
      const matchCat = (currentCategory === 'all' || item.category === currentCategory);
      const matchSub = (currentSubCategory === 'all' || item.subCategory === currentSubCategory);
      const matchSearch = (!currentSearchQuery || 
        (item.topic && item.topic.toLowerCase().includes(currentSearchQuery)) || 
        (item.desc && item.desc.toLowerCase().includes(currentSearchQuery)) ||
        (item.subCategory && item.subCategory.toLowerCase().includes(currentSearchQuery)));

      return matchPart && matchCat && matchSub && matchSearch;
    });

    if (badgeCount) badgeCount.innerText = `${results.length} เรื่อง`;

    if (results.length === 0) {
      container.innerHTML = '';
      if (notice) notice.classList.remove('hidden');
      return;
    }

    if (notice) notice.classList.add('hidden');

    container.innerHTML = results.map(item => {
      const safePart = (item.part || '').replace(/'/g, "\\'");
      const safeCat = (item.category || '').replace(/'/g, "\\'");
      const safeTopic = (item.topic || '').replace(/'/g, "\\'");
      const safeSub = (item.subCategory || '').replace(/'/g, "\\'");
      const iconName = item.icon || 'menu_book';
      const questionCountText = item.count ? `${item.count} ข้อ` : item.part;
      const shortSub = item.subCategory ? item.subCategory.split(' ')[0] : (item.category || '');

      if (isGrid) {
        return `
          <div onclick="openExamSetup('${safePart}', '${safeCat}', '${safeTopic}', '${safeSub}')" 
               class="bg-white rounded-2xl p-3 border border-[#E8DFD3] shadow-2xs hover:border-[#755634] flex flex-col justify-between transition-all cursor-pointer active:scale-97">
            <div class="space-y-1">
              <div class="flex items-center justify-between">
                <div class="w-7 h-7 rounded-lg bg-[#FAF6F0] text-[#755634] flex items-center justify-center font-bold shrink-0">
                  <span class="material-symbols-outlined text-[17px]">${iconName}</span>
                </div>
                <span class="text-[9px] font-bold text-amber-800 bg-amber-50 px-1.5 py-0.5 rounded-full">${questionCountText}</span>
              </div>
              <h4 class="text-xs font-bold text-slate-800 leading-snug line-clamp-1 pt-0.5" title="${item.topic || ''}">${item.topic || '-'}</h4>
              <p class="text-[10px] text-slate-400 line-clamp-1 leading-tight">${item.desc || ''}</p>
            </div>
            <div class="pt-2 mt-1.5 border-t border-slate-100 flex items-center justify-between">
              <span class="text-[9px] text-[#755634] font-medium truncate max-w-[85px]">${shortSub}</span>
              <span class="text-[10px] font-bold text-[#755634] flex items-center gap-0.5">
                <span>เริ่ม</span><i class="fa-solid fa-arrow-right text-[8px]"></i>
              </span>
            </div>
          </div>
        `;
      } else {
        return `
          <div onclick="openExamSetup('${safePart}', '${safeCat}', '${safeTopic}', '${safeSub}')" 
               class="bg-white rounded-xl p-2.5 border border-[#E8DFD3] shadow-2xs hover:border-[#755634] flex items-center justify-between gap-2.5 transition-all cursor-pointer active:scale-[0.99]">
            <div class="w-8 h-8 rounded-lg bg-[#FAF6F0] text-[#755634] flex items-center justify-center font-bold shrink-0">
              <span class="material-symbols-outlined text-[18px]">${iconName}</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-[8px] font-bold text-amber-800 bg-amber-50 px-1 rounded">${questionCountText}</span>
                <span class="text-[9px] text-stone-400 truncate">${item.subCategory || item.category || ''}</span>
              </div>
              <h4 class="text-xs font-bold text-slate-800 truncate">${item.topic || '-'}</h4>
              <p class="text-[10px] text-slate-400 truncate">${item.desc || ''}</p>
            </div>
            <div class="shrink-0 flex items-center justify-center w-6 h-6 rounded-full bg-stone-50 text-[#755634]">
              <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </div>
          </div>
        `;
      }
    }).join('');
  }

  function handleSearch(val) {
    currentSearchQuery = (val || '').trim().toLowerCase();
    renderCardsLevel4();
  }

  function setViewMode(mode) {
    currentViewMode = mode;
    const btnGrid = document.getElementById('btnViewGrid');
    const btnList = document.getElementById('btnViewList');

    if (mode === 'grid') {
      btnGrid.className = 'w-7 h-7 rounded-lg flex items-center justify-center text-[#755634] bg-[#f5eee6] transition-all';
      btnList.className = 'w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 transition-all';
    } else {
      btnList.className = 'w-7 h-7 rounded-lg flex items-center justify-center text-[#755634] bg-[#f5eee6] transition-all';
      btnGrid.className = 'w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 transition-all';
    }
    renderCardsLevel4();
  }

  function openExamSetup(part, category, topic, subCategory = '') {
    activeExamConfig.part = part;
    activeExamConfig.category = category;
    activeExamConfig.subCategory = subCategory;
    activeExamConfig.topic = topic;

    document.getElementById('modalPartTag').innerText = part;
    document.getElementById('modalSubjectTitle').innerText = topic;
    document.getElementById('modalCategorySubtitle').innerText = `${category} ${subCategory ? '• ' + subCategory : ''}`;

    selectModalMode('practice');
    selectModalCount(20);
    document.getElementById('examModeModal').classList.remove('hidden');
  }

  function closeModeModal() {
    document.getElementById('examModeModal').classList.add('hidden');
  }

  function selectModalMode(mode) {
    activeExamConfig.mode = mode;
    ['practice', 'competition', 'mock'].forEach(m => {
      const btn = document.getElementById(m === 'practice' ? 'optModePractice' : m === 'competition' ? 'optModeCompetition' : 'optModeMock');
      if (btn) {
        btn.className = (m === mode) 
          ? 'mode-opt-btn p-2 rounded-xl border-2 border-[#755634] bg-[#f5eee6] text-center transition-all'
          : 'mode-opt-btn p-2 rounded-xl border border-gray-200 bg-white hover:bg-stone-50 text-center transition-all';
      }
    });

    const mockNotice = document.getElementById('mockNotice');
    if (mode === 'mock') {
      selectModalCount(20);
      document.querySelectorAll('.count-opt-btn').forEach(b => b.disabled = true);
      if (mockNotice) mockNotice.classList.remove('hidden');
    } else {
      document.querySelectorAll('.count-opt-btn').forEach(b => b.disabled = false);
      if (mockNotice) mockNotice.classList.add('hidden');
    }
  }

  function selectModalCount(count) {
    activeExamConfig.count = count;
    [10, 20, 50].forEach(cnt => {
      const btn = document.getElementById(`optCount${cnt}`);
      if (btn) {
        btn.className = (cnt === count)
          ? 'count-opt-btn py-2 rounded-xl border-2 border-[#755634] bg-[#f5eee6] text-xs font-bold text-[#755634] shadow-2xs transition-all'
          : 'count-opt-btn py-2 rounded-xl border border-gray-200 bg-white text-xs font-bold text-gray-700 hover:bg-gray-50 transition-all';
      }
    });
  }

  function startSelectedQuiz() {
    const params = new URLSearchParams();
    params.set('part', activeExamConfig.part);
    params.set('category', activeExamConfig.category);
    if (activeExamConfig.subCategory) params.set('sub_category', activeExamConfig.subCategory);
    params.set('topic', activeExamConfig.topic);
    params.set('mode', activeExamConfig.mode);
    params.set('count', activeExamConfig.count);
    window.location.href = `quiz.html?${params.toString()}`;
  }

  function startScopeExam() {
    const params = new URLSearchParams();
    if (currentPart) params.set('part', currentPart);
    if (currentCategory && currentCategory !== 'all') params.set('category', currentCategory);
    if (currentSubCategory && currentSubCategory !== 'all') params.set('sub_category', currentSubCategory);
    params.set('mode', 'practice');
    params.set('count', 20);
    window.location.href = `quiz.html?${params.toString()}`;
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const uInfo = JSON.parse(localStorage.getItem('user_profile') || localStorage.getItem('kru_user_info') || '{}');
      if (uInfo.name) {
        document.getElementById('userHeaderBadge').innerText = uInfo.name.charAt(0);
      }
    } catch (e) {}

    await fetchRealtimeTopics();
    selectMainPart('ภาค ก');
  });


</script>
</body>
</html>
