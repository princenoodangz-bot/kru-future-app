<!DOCTYPE html>
<html class="h-full" lang="th">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>ครูในอนาคต - เข้าสู่ระบบ</title>
  <!-- แท็กสำหรับ iPhone / iPad (iOS Safari) ต้องเขียนตรงนี้เท่านั้น -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ครูในอนาคต">
  <meta name="theme-color" content="#755634">

  <!-- เชื่อมต่อ Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="theme-manager.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#fff8f6] text-[#1e1b1a] antialiased min-h-full flex flex-col justify-center py-6 px-4">

  <main class="w-full max-w-[390px] mx-auto flex flex-col">

    <!-- แถบหัวเรื่อง + ภาษา -->
    <div class="flex items-center justify-between mb-4 px-1">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-[#755634] flex items-center justify-center text-white shadow-xs">
          <span class="material-symbols-outlined text-[20px]">school</span>
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-base text-[#1e1b1a] leading-none">ครูในอนาคต</span>
          <span class="text-[10px] text-gray-500 mt-0.5">ระบบทดสอบความรู้ของการเป็นครู</span>
        </div>
      </div>
      <div class="inline-flex items-center p-0.5 bg-gray-200/60 rounded-full text-xs">
        <button type="button" class="px-2.5 py-0.5 rounded-full bg-white text-[#755634] font-bold shadow-xs">TH</button>
        <button type="button" class="px-2.5 py-0.5 rounded-full text-gray-500">EN</button>
      </div>
    </div>

    <!-- โลโก้อินทรธนู / มาสคอต & คำต้อนรับ -->
    <div class="flex flex-col items-center text-center my-2">
      <div class="relative mb-3">
        <div class="w-24 h-24 rounded-full bg-[#f2e1bf]/40 border border-[#e8ded4] flex items-center justify-center shadow-inner overflow-hidden p-2">
          <!-- ตราสัญลักษณ์อินทรธนูข้าราชการครู -->
          <svg class="w-14 h-14" viewBox="0 0 64 80" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 8C12 4 16 2 32 2C48 2 52 4 52 8V72C52 76 48 78 32 78C16 78 12 76 12 72V8Z" fill="#EAB308" stroke="#CA8A04" stroke-width="2"/>
            <path d="M14 24H50" stroke="#FEF08A" stroke-width="4"/>
            <path d="M14 38H50" stroke="#FEF08A" stroke-width="4"/>
            <path d="M14 52H50" stroke="#FEF08A" stroke-width="4"/>
            <circle cx="32" cy="14" r="4" fill="#FEF08A"/>
          </svg>
        </div>
        <span class="absolute bottom-0 right-0 flex h-6 w-6 items-center justify-center rounded-full bg-[#964320] text-white shadow">
          <span class="material-symbols-outlined text-[13px]">auto_stories</span>
        </span>
      </div>

      <div class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-[#f2e1bf]/70 text-[#755634] mb-1.5 shadow-2xs">
        <span class="text-xs">🔥</span>
        <span class="text-[11px] font-bold">เข้าสู่ระบบเพื่อทำข้อสอบ</span>
      </div>

      <h1 class="text-xl font-extrabold text-gray-800">ยินดีต้อนรับกลับมา!</h1>
      <p class="text-xs text-gray-500 mt-1 max-w-xs">
        ไม่ใช่แค่เพียงอ่านหนังสือ แล้วจะทำให้ทำข้อสอบได้เต็ม
      </p>
    </div>

    <!-- กล่องฟอร์มล็อกอิน -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-[#e8ded4] mt-2">
      
      <!-- แท็บสลับประเภทล็อกอิน -->
      <div class="grid grid-cols-2 gap-1 p-1 bg-gray-100 rounded-xl mb-4 text-xs font-semibold">
        <button type="button" id="tabLoginId" onclick="switchLoginMode('id')" class="py-2 rounded-lg bg-white text-[#755634] shadow-xs flex items-center justify-center gap-1 transition-all">
          <span class="material-symbols-outlined text-[16px]">smartphone</span>
          <span>เบอร์โทร / รหัสผู้ใช้</span>
        </button>
        <button type="button" id="tabLoginGuest" onclick="switchLoginMode('guest')" class="py-2 rounded-lg text-gray-500 hover:text-gray-800 flex items-center justify-center gap-1 transition-all">
          <span class="material-symbols-outlined text-[16px]">assignment_turned_in</span>
          <span>ทดลองทำข้อสอบ</span>
        </button>
      </div>

      <form onsubmit="handleLoginSubmit(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1" id="loginLabel">
            รหัสประจำตัวผู้สอบ / Student ID
          </label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3 text-gray-400 text-[18px]">mail</span>
            <input id="identifierInput" type="text" required class="w-full bg-[#faf6f0] pl-9 pr-3 py-2.5 rounded-xl border border-transparent focus:border-[#755634] focus:bg-white text-xs outline-none transition-all placeholder:text-gray-400" placeholder="อีเมล หรือ เบอร์โทร">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">รหัสผ่าน</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3 text-gray-400 text-[18px]">lock</span>
            <input id="passwordInput" type="password" required class="w-full bg-[#faf6f0] pl-9 pr-9 py-2.5 rounded-xl border border-transparent focus:border-[#755634] focus:bg-white text-xs outline-none transition-all placeholder:text-gray-400" placeholder="รหัสผ่านที่ได้รับ">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-2.5 text-gray-400 hover:text-gray-600 p-1">
              <span id="eyeIcon" class="material-symbols-outlined text-[18px]">visibility_off</span>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs pt-0.5">
          <label class="flex items-center gap-1.5 cursor-pointer text-gray-600">
            <input type="checkbox" checked class="w-3.5 h-3.5 accent-[#755634] rounded">
            <span>จดจำการเข้าสู่ระบบ</span>
          </label>
          <a href="#" onclick="alert('กรุณาติดต่อผู้ดูแลระบบเพื่อรีเซ็ตรหัสผ่าน');" class="text-xs text-gray-500 hover:underline">ลืมรหัสผ่าน?</a>
        </div>

        <button id="btnSubmitLogin" type="submit" class="w-full mt-2 bg-[#755634] hover:bg-[#896443] text-white py-3 rounded-xl text-xs font-bold shadow-sm transition-all flex justify-center items-center gap-1.5 active:scale-[0.99]">
          <span>เข้าสู่ระบบ (Sign In)</span>
          <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
        </button>
      </form>

      <div class="relative my-4 flex items-center justify-center">
        <div class="w-full border-t border-gray-200"></div>
        <span class="absolute bg-white px-2 text-[10px] text-gray-400">หรือเข้าสู่ระบบด้วย</span>
      </div>

    </div>

    <!-- ส่วนท้ายด้านล่างการ์ด -->
    <div class="text-center mt-5 text-xs text-gray-500">
      ยังไม่มีบัญชี ExamPro? 
      <a href="#" onclick="alert('กรุณาติดต่อแอดมินเพื่อลงทะเบียนสอบ');" class="font-bold text-[#755634] hover:underline ml-0.5">สมัครสมาชิกใหม่</a>
    </div>

  </main>

  <script>
    // 1. ซ่อน/แสดงรหัสผ่าน
    function togglePasswordVisibility() {
      const passInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.innerText = 'visibility';
      } else {
        passInput.type = 'password';
        eyeIcon.innerText = 'visibility_off';
      }
    }

    // 2. สลับโหมดล็อกอิน
    function switchLoginMode(mode) {
      const tabId = document.getElementById('tabLoginId');
      const tabGuest = document.getElementById('tabLoginGuest');
      const label = document.getElementById('loginLabel');
      const input = document.getElementById('identifierInput');

      if (mode === 'id') {
        tabId.className = 'py-2 rounded-lg bg-white text-[#755634] shadow-xs flex items-center justify-center gap-1 transition-all';
        tabGuest.className = 'py-2 rounded-lg text-gray-500 hover:text-gray-800 flex items-center justify-center gap-1 transition-all';
        label.innerText = 'รหัสประจำตัวผู้สอบ / Student ID';
        input.placeholder = 'อีเมล หรือ เบอร์โทร';
      } else {
        tabGuest.className = 'py-2 rounded-lg bg-white text-[#755634] shadow-xs flex items-center justify-center gap-1 transition-all';
        tabId.className = 'py-2 rounded-lg text-gray-500 hover:text-gray-800 flex items-center justify-center gap-1 transition-all';
        label.innerText = 'รหัสทดสอบ / Guest ID';
        input.placeholder = 'กรอกรหัสทดสอบ';
      }
    }

    // 3. ส่งข้อมูลตรวจสอบกับ Supabase
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById('identifierInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const btn = document.getElementById('btnSubmitLogin');

      btn.disabled = true;
      btn.innerHTML = '<span>กำลังตรวจสอบ...</span>';

      try {
        const { data: user, error } = await supabase
          .from('users')
          .select('id, student_id, name, password_hash, role')
          .eq('student_id', identifier)
          .single();

        if (error || !user || user.password_hash !== password) {
          alert('รหัสประจำตัว หรือ รหัสผ่านไม่ถูกต้อง');
          return;
        }

        const newSessionToken = "sess_" + crypto.randomUUID();
        await supabase.from('users').update({ 
          active_session_token: newSessionToken,
          updated_at: new Date().toISOString()
        }).eq('id', user.id);

        localStorage.setItem('kru_active_session', newSessionToken);
        localStorage.setItem('kru_user_info', JSON.stringify({
          id: user.id, studentId: user.student_id, name: user.name, role: user.role
        }));

        if (user.role === 'admin') {
          location.href = 'admin.html';
        } else {
          location.href = 'index.html';
        }

      } catch (err) {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>เข้าสู่ระบบ (Sign In)</span><span class="material-symbols-outlined text-[16px]">arrow_forward</span>';
      }
    }
  </script>
</body>
</html>
